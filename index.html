    // ================================================================
    //  GAME REPORT
    // ================================================================
    showReport() {
        if(!this.moves.length){alert('Import permainan dulu!');return;}
        document.getElementById('report-body').innerHTML=this.genReport();
        document.getElementById('m-report').classList.add('active');
    },

    genReport() {
        const res=this.headers.Result||'*';
        const cnt={excellent:0,good:0,inaccuracy:0,mistake:0,blunder:0,gamechanging:0};
        let tp=0;
        Object.values(this.classifications).forEach(c=>{if(c.type!=='opponent'&&cnt.hasOwnProperty(c.type)){cnt[c.type]++;tp++;}});
        const acc=tp>0?((cnt.excellent+cnt.good)/tp*100).toFixed(0):0;

        const won=(res==='1-0'&&this.playerColor==='white')||(res==='0-1'&&this.playerColor==='black');
        const lost=(res==='1-0'&&this.playerColor==='black')||(res==='0-1'&&this.playerColor==='white');

        let summary;
        if(won) summary=`Kamu menang! Dari ${tp} langkah, ${cnt.excellent+cnt.good} bagus, ${cnt.mistake+cnt.blunder+cnt.gamechanging} buruk.`;
        else if(lost) summary=`Kamu kalah. ${cnt.blunder+cnt.gamechanging} blunder kemungkinan besar menyebabkan kekalahan.`;
        else if(res==='1/2-1/2') summary=`Permainan seri. Akurasi ${acc}%.`;
        else summary=`Permainan selesai. Akurasi ${acc}% dari ${tp} langkah.`;

        // Top mistakes
        const msts=Object.entries(this.classifications).filter(([,c])=>['mistake','blunder','gamechanging'].includes(c.type)).sort(([,a],[,b])=>Math.abs(b.evalDiff)-Math.abs(a.evalDiff)).slice(0,3);
        let mH='';
        msts.forEach(([i,c])=>{
            const mv=this.moves[+i-1];
            const mn=Math.ceil(+i/2),iw=+i%2===1;
            const ms=mv?`${mn}. ${iw?'':'...'}${mv.san}`:`Move ${i}`;
            mH+=`<div class="report-item critical"><strong>${c.emoji} ${ms}</strong> — ${c.label} (${c.evalDiff.toFixed(1)})<br><small>${this.whatMissed(mv,+i)}</small></div>`;
        });

        // Top strengths
        const strs=Object.entries(this.classifications).filter(([,c])=>['excellent','good'].includes(c.type)).slice(0,3);
        let sH='';
        strs.forEach(([i,c])=>{
            const mv=this.moves[+i-1];
            const mn=Math.ceil(+i/2),iw=+i%2===1;
            const ms=mv?`${mn}. ${iw?'':'...'}${mv.san}`:`Move ${i}`;
            sH+=`<div class="report-item strength"><strong>🟢 ${ms}</strong> — ${c.label}<br><small>${this.whyGood(mv,this.evals[+i])}</small></div>`;
        });

        // Main weakness
        let mw;
        if(cnt.blunder+cnt.gamechanging>cnt.mistake) mw='Tactical awareness — sering mengabaikan taktik yang mengubah permainan.';
        else if(cnt.mistake>2) mw='Kalkulasi — sering membuat kesalahan yang menunjukkan perhitungan tidak cukup dalam.';
        else if(cnt.inaccuracy>3) mw='Pemahaman positional — sering melewatkan langkah lebih aktif/tepat.';
        else mw='Konsistensi — perlu latihan untuk mempertahankan fokus sepanjang permainan.';

        // Main strength
        let ms2;
        if(cnt.excellent>cnt.good) ms2='Intuisi positional — sering menemukan langkah sangat tepat.';
        else if(cnt.good>cnt.inaccuracy) ms2='Solid play — mayoritas langkah bagus dan posisi terjaga.';
        else if(cnt.excellent+cnt.good>tp*0.5) ms2='Pemahaman dasar baik — lebih dari setengah langkah berkualitas.';
        else ms2='Potensi — ada langkah bagus yang menunjukkan pemahaman konsep catur.';

        // Root cause
        let rc;
        if(cnt.blunder+cnt.gamechanging>=2) rc='Kurang melakukan "blunder check". Kebiasaan memeriksa skak, tangkapan, dan ancaman lawan sebelum berkomitmen akan mengurangi blunder drastis.';
        else if(cnt.mistake>=3) rc='Kalkulasi tidak cukup dalam. Cenderung berhenti menghitung terlalu cepat dan melewatkan respons terbaik lawan.';
        else rc='Attention dan konsistensi. Kesalahan kecil terakumulasi. Fokus pada setiap langkah dan periksa ancaman lawan.';

        // Training
        let tr='';
        if(cnt.blunder+cnt.gamechanging>=2) tr+=`<div class="report-item training"><strong>🎯 Anti-Blunder</strong><br>Lakukan 15 puzzle taktis/hari fokus fork, pin, skewer. Sebelum langkah, tanya: "Ada skak/tangkapan/ancaman balasan?"</div>`;
        if(cnt.mistake>=3) tr+=`<div class="report-item training"><strong>🎯 Kalkulasi</strong><br>10 puzzle kalkulasi 3-5 langkah/hari. Hitung SEMUA langkah paksa lawan. Metode: Skak → Tangkapan → Ancaman.</div>`;
        if(cnt.inaccuracy>=4) tr+=`<div class="report-item training"><strong>🎯 Positional</strong><br>Pelajari permainan master di opening kamu. Fokus rencana middlegame, struktur pion, penempatan buah. 2 game master/minggu.</div>`;
        if(!tr) tr=`<div class="report-item training"><strong>🎯 Pertahankan Momentum</strong><br>Performa cukup baik! Latihan taktik ringan (10 puzzle/hari), analisis game sendiri sebelum engine.</div>`;

        return `
            <div class="report-section"><h3>📊 Hasil</h3><div class="report-item"><strong>Hasil:</strong> ${res} | <strong>Langkah:</strong> ${this.moves.length} | <strong>Akurasi:</strong> ${acc}%</div></div>
            <div class="report-section"><h3>📝 Ringkasan</h3><div class="report-item">${summary}</div>
            <div class="report-item" style="font-size:0.82em;color:var(--text2)">🟢 Excellent: ${cnt.excellent} | 🟢 Good: ${cnt.good} | 🔵 Inaccuracy: ${cnt.inaccuracy} | 🟡 Mistake: ${cnt.mistake} | 🔴 Blunder: ${cnt.blunder+cnt.gamechanging}</div></div>
            <div class="report-section"><h3>❌ Top 3 Mistakes</h3>${mH||'<div class="report-item">Tidak ada mistake signifikan!</div>'}</div>
            <div class="report-section"><h3>✅ Top 3 Strengths</h3>${sH||'<div class="report-item">Game cukup solid.</div>'}</div>
            <div class="report-section"><h3>🔥 Momen Kritis</h3>${this.criticals.map(c=>`<div class="report-item critical">${c.ms} — ${c.reason}</div>`).join('')}</div>
            <div class="report-section"><h3>📉 Kelemahan Utama</h3><div class="report-item weakness">${mw}</div></div>
            <div class="report-section"><h3>📈 Kekuatan Utama</h3><div class="report-item strength">${ms2}</div></div>
            <div class="report-section"><h3>🔍 Akar Masalah</h3><div class="report-item">${rc}</div></div>
            <div class="report-section"><h3>🎯 Latihan</h3>${tr}</div>
        `;
    },

    // ================================================================
    //  PLAYER PROFILE
    // ================================================================
    loadProfile() {
        const s=localStorage.getItem('cc_profile');
        this.profile=s?JSON.parse(s):{games:[],totalGames:0,wins:0,losses:0,draws:0,
            skills:{tacticalAwareness:50,calculation:50,blunderFreq:50,candidateMoves:50,threatDetection:50,positional:50,kingSafety:50,pieceActivity:50,pawnStructure:50,opening:50,endgame:50,timeMgmt:50,patternRec:50},trends:[]};
        const sm=localStorage.getItem('cc_mistakes');
        this.mistakes=sm?JSON.parse(sm):[];
    },

    saveProfile() {
        localStorage.setItem('cc_profile',JSON.stringify(this.profile));
        localStorage.setItem('cc_mistakes',JSON.stringify(this.mistakes));
    },

    saveToProfile() {
        const res=this.headers.Result||'*';
        const cnt={excellent:0,good:0,inaccuracy:0,mistake:0,blunder:0,gamechanging:0};
        let tp=0;
        Object.values(this.classifications).forEach(c=>{if(c.type!=='opponent'&&cnt.hasOwnProperty(c.type)){cnt[c.type]++;tp++;}});

        this.profile.totalGames++;
        if(res==='1-0'){this.playerColor==='white'?this.profile.wins++:this.profile.losses++;}
        else if(res==='0-1'){this.playerColor==='black'?this.profile.wins++:this.profile.losses++;}
        else if(res==='1/2-1/2') this.profile.draws++;

        const acc=tp>0?(cnt.excellent+cnt.good)/tp:0.5;
        const br=tp>0?(cnt.blunder+cnt.gamechanging)/tp:0;
        const sk=this.profile.skills;
        sk.tacticalAwareness=this.lerp(sk.tacticalAwareness,(1-br*3)*100,0.1);
        sk.calculation=this.lerp(sk.calculation,acc*100,0.1);
        sk.blunderFreq=this.lerp(sk.blunderFreq,(1-br*5)*100,0.1);
        sk.threatDetection=this.lerp(sk.threatDetection,(1-br*2)*100,0.1);
        sk.positional=this.lerp(sk.positional,acc*90,0.1);
        sk.candidateMoves=this.lerp(sk.candidateMoves,(cnt.excellent+cnt.good)/(tp||1)*85,0.1);
        sk.kingSafety=this.lerp(sk.kingSafety,(1-br*2)*95,0.08);
        sk.pieceActivity=this.lerp(sk.pieceActivity,acc*88,0.08);
        sk.patternRec=this.lerp(sk.patternRec,(1-br*2)*90,0.1);

        Object.keys(sk).forEach(k=>{sk[k]=Math.max(0,Math.min(100,Math.round(sk[k])));});

        this.profile.games.push({date:new Date().toISOString(),result:res,moves:this.moves.length,accuracy:Math.round(acc*100),blunders:cnt.blunder+cnt.gamechanging,mistakes:cnt.mistake,excellent:cnt.excellent,good:cnt.good});

        Object.entries(this.classifications).forEach(([i,c])=>{
            if(['mistake','blunder','gamechanging'].includes(c.type)){
                const mv=this.moves[+i-1];
                if(mv) this.mistakes.push({gid:this.profile.totalGames,mi:+i,move:mv.san,fen:this.positions[+i],type:c.type,ed:c.evalDiff,root:this.identifyRoot(mv,+i,c),date:new Date().toISOString()});
            }
        });

        this.profile.trends.push({game:this.profile.totalGames,accuracy:Math.round(acc*100),blunders:cnt.blunder+cnt.gamechanging});
        this.saveProfile();
    },

    lerp(c,t,f){return c+(t-c)*f;},

    renderProfile() {
        const el=document.getElementById('profile-content');
        if(!this.profile||this.profile.totalGames===0){
            el.innerHTML='<div class="empty-state"><div class="es-icon">👤</div><p>Belum ada data. Analisis permainan untuk membangun profil.</p></div>';return;
        }
        const p=this.profile;
        let h=`<div class="profile-stats">
            <div class="stat-card"><div class="sv">${p.totalGames}</div><div class="sl">Total Game</div></div>
            <div class="stat-card"><div class="sv" style="color:var(--green)">${p.wins}</div><div class="sl">Menang</div></div>
            <div class="stat-card"><div class="sv" style="color:var(--red)">${p.losses}</div><div class="sl">Kalah</div></div>
            <div class="stat-card"><div class="sv" style="color:var(--text2)">${p.draws}</div><div class="sl">Seri</div></div>
        </div>`;

        const sn={tacticalAwareness:'Tactical Awareness',calculation:'Kalkulasi',blunderFreq:'Anti-Blunder',candidateMoves:'Candidate Moves',threatDetection:'Deteksi Ancaman',positional:'Positional',kingSafety:'King Safety',pieceActivity:'Piece Activity',pawnStructure:'Pawn Structure',opening:'Opening',endgame:'Endgame',timeMgmt:'Time Management',patternRec:'Pattern Recognition'};

        h+='<h3 style="margin:16px 0 10px;font-size:0.92em">📈 Kemampuan</h3>';
        Object.entries(p.skills).forEach(([k,v])=>{
            const col=v>=70?'var(--green)':v>=40?'var(--orange)':'var(--red)';
            h+=`<div class="skill-bar"><div class="sk-name"><span>${sn[k]||k}</span><span>${v}%</span></div><div class="sk-bar"><div class="sk-fill" style="width:${v}%;background:${col}"></div></div></div>`;
        });

        if(p.trends.length>0){
            h+='<h3 style="margin:16px 0 10px;font-size:0.92em">📊 Tren</h3>';
            p.trends.slice(-10).forEach(t=>{
                const ac=t.accuracy>=70?'var(--green)':t.accuracy>=40?'var(--orange)':'var(--red)';
                h+=`<div class="pattern-item"><div class="pi-icon">🎮</div><div class="pi-info"><div class="pi-title">Game #${t.game}</div><div class="pi-desc">Akurasi: ${t.accuracy}% | Blunder: ${t.blunders}</div></div><div style="color:${ac};font-weight:700">${t.accuracy}%</div></div>`;
            });
        }

        // Pattern detection
        if(this.mistakes.length>3){
            h+='<h3 style="margin:16px 0 10px;font-size:0.92em">🔍 Pola yang Terdeteksi</h3>';
            const types={};
            this.mistakes.forEach(m=>{types[m.type]=(types[m.type]||0)+1;});
            const sorted=Object.entries(types).sort(([,a],[,b])=>b-a);
            sorted.forEach(([t,c])=>{
                const em=t==='blunder'?'🔴':t==='gamechanging'?'⚫':'🟡';
                const lb=t==='blunder'?'Blunder':t==='gamechanging'?'Blunder Fatal':'Mistake';
                h+=`<div class="pattern-item"><div class="pi-icon">${em}</div><div class="pi-info"><div class="pi-title">${lb}: ${c} kali</div><div class="pi-desc">${c>3?'⚠️ Pola berulang — perlu latihan khusus!':'Perhatikan dan hindari di game berikutnya.'}</div></div></div>`;
            });
        }

        el.innerHTML=h;
    },

    // ================================================================
    //  TRAINING GENERATOR
    // ================================================================
    renderTraining() {
        const el=document.getElementById('training-content');
        if(!this.profile||this.profile.totalGames===0){
            el.innerHTML='<div class="empty-state"><div class="es-icon">🎯</div><p>Mainkan dan analisis beberapa permainan untuk rekomendasi latihan personal.</p></div>';return;
        }
        let h='';
        const sk=this.profile.skills;
        const sorted=Object.entries(sk).sort(([,a],[,b])=>a-b);
        const weakest=sorted.slice(0,3);

        const tm={
            tacticalAwareness:{t:'🎯 Latihan Taktik — Fork & Pin',d:'15 puzzle taktis/hari fokus fork dan pin. Metode "CCT" (Checks, Captures, Threats) untuk periksa semua langkah paksa sebelum bermain.'},
            calculation:{t:'🧮 Kalkulasi Dalam',d:'10 puzzle kalkulasi 3-5 langkah/hari. Hitung SEMUA respons paksa lawan. Tulis variasi yang dihitung sebelum bermain.'},
            blunderFreq:{t:'🛡️ Routine Anti-Blunder',d:'Sebelum setiap langkah: (1) Buah saya aman? (2) Ada skak/tangkapan balasan? (3) Meninggalkan sesuatu tanpa pertahanan?'},
            candidateMoves:{t:'🤔 Candidate Moves',d:'Di setiap posisi, identifikasi minimal 3 candidate moves sebelum menghitung. Proses: "Apa tujuan saya? Langkah mana yang mencapainya?"'},
            threatDetection:{t:'👁️ Deteksi Ancaman',d:'Setelah langkah lawan, identifikasi: Apa yang diancam? Buah mana tidak aman? Ada taktik tersembunyi? 10 posisi/hari.'},
            positional:{t:'📐 Studi Positional',d:'Pelajari 2 game master/minggu di opening kamu. Fokus: rencana middlegame, struktur pion, manuver buah.'},
            kingSafety:{t:'🏰 King Safety',d:'Pelajari pola serangan raja: Greek Gift, serangan pion, baterai menteri+gajah. Pahami kapan castling dan kapan raja aman di pusat.'},
            pieceActivity:{t:'♟ Aktivitas Buah',d:'Di setiap posisi, identifikasi buah terburuk dan cari cara mengaktifkannya. 10 posisi middlegame/hari.'},
            pawnStructure:{t:'🏗️ Struktur Pion',d:'Pelajari: isolated pawn, backward pawn, pawn chain, passed pawn. Pahami rencana di setiap struktur.'},
            opening:{t:'📚 Opening Repertoire',d:'Pilih 2-3 opening dan pelajari rencana middlegame-nya (bukan hafalan). Pahami struktur pion dan rencana khas.'},
            endgame:{t:'♔ Endgame',d:'Kuasai: King+Pawn vs King, Rook endgame (Lucena & Philidor), prinsip endgame (aktivasi raja, opposition, zugzwang).'},
            timeMgmt:{t:'⏰ Manajemen Waktu',d:'Budget: opening 10%, middlegame 60%, endgame 30%. Jangan habiskan waktu di posisi dikenal. Luangkan waktu di momen kritis.'},
            patternRec:{t:'🔄 Pattern Recognition',d:'Pelajari pola: back-rank mate, smothered mate, windmill, x-ray. 20 puzzle pattern/hari.'}
        };

        h+='<div style="font-size:0.85em;color:var(--text2);margin-bottom:12px">Berdasarkan kelemahan dari semua permainan yang dianalisis:</div>';
        weakest.forEach(([k,v])=>{
            const tr=tm[k]; if(!tr) return;
            h+=`<div class="training-card"><h4>${tr.t} <span style="font-weight:400;font-size:0.8em;color:var(--text3)">(${v}%)</span></h4><p>${tr.d}</p></div>`;
        });

        if(this.mistakes.length>0){
            h+='<h3 style="margin:18px 0 10px;font-size:0.92em">🔍 Pola Mistake</h3>';
            const types={};
            this.mistakes.forEach(m=>{types[m.type]=(types[m.type]||0)+1;});
            Object.entries(types).sort(([,a],[,b])=>b-a).forEach(([t,c])=>{
                const em=t==='blunder'?'🔴':t==='gamechanging'?'⚫':'🟡';
                const lb=t==='blunder'?'Blunder':t==='gamechanging'?'Blunder Fatal':'Mistake';
                h+=`<div class="pattern-item"><div class="pi-icon">${em}</div><div class="pi-info"><div class="pi-title">${lb}: ${c} kali</div><div class="pi-desc">${c>3?'Pola berulang — latihan khusus diperlukan!':'Hindari di game berikutnya.'}</div></div></div>`;
            });
        }

        el.innerHTML=h;
    },

    // ================================================================
    //  MISTAKES DATABASE
    // ================================================================
    renderMistakes() {
        const el=document.getElementById('mistakes-content');
        if(!this.mistakes.length){el.innerHTML='<div class="empty-state"><div class="es-icon">📚</div><p>Belum ada mistake tercatat. Analisis permainan untuk mulai membangun database.</p></div>';return;}

        let h=`<div style="font-size:0.85em;color:var(--text2);margin-bottom:14px">Total: <strong>${this.mistakes.length}</strong> mistake dari <strong>${this.profile.totalGames}</strong> permainan.</div>`;

        const grouped={};
        this.mistakes.forEach(m=>{if(!grouped[m.type])grouped[m.type]=[];grouped[m.type].push(m);});

        Object.entries(grouped).sort(([,a],[,b])=>b.length-a.length).forEach(([type,msts])=>{
            const em=type==='blunder'?'🔴':type==='gamechanging'?'⚫':'🟡';
            const lb=type==='blunder'?'Blunder':type==='gamechanging'?'Blunder Fatal':'Mistake';
            h+=`<h3 style="margin:14px 0 6px;font-size:0.88em">${em} ${lb} (${msts.length})</h3>`;
            msts.slice(-8).reverse().forEach(m=>{
                h+=`<div class="report-item" style="cursor:pointer" onclick="CC.jumpTo(${m.mi})">
                    <strong>Game #${m.gid} — ${m.move}</strong><br>
                    <small style="color:var(--text2)">Evaluasi: ${m.ed.toFixed(1)} | ${m.root}</small>
                </div>`;
            });
        });

        el.innerHTML=h;
    },

    // ================================================================
    //  SELF-EVALUATION MODE
    // ================================================================
    startSelfEval() {
        if(!this.criticals.length){alert('Analisis permainan dulu untuk Self-Eval!');return;}
        const cm=this.criticals[Math.floor(Math.random()*this.criticals.length)];
        const fen=this.positions[cm.mi-1]||this.positions[0];
        const am=this.moves[cm.mi-1];

        const bd=document.getElementById('selfeval-body');
        bd.innerHTML=`<h2>🧠 Self-Evaluation</h2>
            <p style="color:var(--accent);font-size:1em;margin:10px 0">Di posisi ini (sebelum ${cm.ms}), apa yang kamu mainkan?</p>
            <div id="se-board" class="self-eval-board"></div>
            <div class="form-group"><label>Langkah kamu (SAN: Nf3, e4, O-O...):</label><input type="text" id="se-move" placeholder="Masukkan langkah..."></div>
            <div class="form-group"><label>Kenapa langkah ini?</label><textarea id="se-reason" placeholder="Jelaskan pemikiran kamu..." style="min-height:70px"></textarea></div>
            <div class="btn-group" style="justify-content:center"><button class="btn btn-primary" onclick="CC.submitSE(${cm.mi})">🔍 Lihat Hasil</button></div>
            <div id="se-result" style="margin-top:14px"></div>`;

        document.getElementById('m-selfeval').classList.add('active');

        setTimeout(()=>{
            const sb=document.getElementById('se-board');
            const g=new Chess(fen), bs=g.board();
            let seFrom=null;
            for(let r=0;r<8;r++) for(let c=0;c<8;c++){
                const sq=document.createElement('div');
                const isL=(r+c)%2===0;
                sq.className=`se-sq ${isL?'light':'dark'}`;
                const p=bs[r][c];
                if(p) sq.textContent=this.PIECES[p.color==='w'?p.type.toUpperCase():p.type];
                sq.addEventListener('click',()=>{
                    document.querySelectorAll('.se-sq').forEach(s=>s.classList.remove('se-selected'));
                    sq.classList.add('se-selected');
                    const files='abcdefgh';
                    const inp=document.getElementById('se-move');
                    if(seFrom){
                        inp.value=seFrom+files[c]+(8-r);
                        seFrom=null;
                        document.querySelectorAll('.se-sq').forEach(s=>s.classList.remove('se-selected'));
                    } else {
                        seFrom=files[c]+(8-r);
                    }
                });
                sb.appendChild(sq);
            }
        },100);
    },

    submitSE(mi) {
        const um=document.getElementById('se-move').value.trim();
        const ur=document.getElementById('se-reason').value.trim();
        const rd=document.getElementById('se-result');
        if(!um){alert('Masukkan langkah!');return;}

        const fen=this.positions[mi-1]||this.positions[0];
        const am=this.moves[mi-1];
        const ev=this.evals[mi], pe=this.evals[mi-1];

        const g=new Chess(fen);
        const vm=g.move(um);
        let ue=null;
        if(vm) ue=this.basicEval(g.fen());

        const aev=ev?(ev.eval/100).toFixed(1):'?';
        const uev=ue?(ue.eval/100).toFixed(1):'?';

        let comp='';
        if(vm&&ue&&ev){
            const d=Math.abs(ue.eval-ev.eval)/100;
            if(d<0.3) comp='✅ Langkah kamu hampir sama bagusnya dengan langkah terbaik!';
            else if(d<1) comp='⚠️ Langkah kamu playable tapi ada yang lebih baik.';
            else comp='❌ Langkah terbaik secara signifikan lebih kuat.';
        } else if(!vm) comp='❌ Langkah tidak valid di posisi ini.';

        let reasonFb='';
        if(ur){
            const rl=ur.toLowerCase();
            if(rl.includes('serang')||rl.includes('attack')) reasonFb+='Kamu memikirkan serangan — bagus! Pastikan didukung cukup buah. ';
            if(rl.includes('defend')||rl.includes('pertahan')) reasonFb+='Memperhatikan pertahanan — penting. Pastikan tidak terlalu pasif. ';
            if(rl.includes('pusat')||rl.includes('center')) reasonFb+='Memperhatikan pusat — prinsip bagus. ';
            if(rl.includes('raja')||rl.includes('king')) reasonFb+='Memperhatikan keselamatan raja — sangat penting. ';
            if(!reasonFb) reasonFb='Pastikan reasoning mencakup: (1) Apa yang diancam lawan? (2) Apa rencana saya? (3) Apakah langkah ini aman?';
        }

        const cl=this.classifications[mi];
        const expl=cl?this.explain(mi,am,cl,ev,pe):{lesson:'Pelajari posisi ini lebih dalam.'};

        rd.innerHTML=`
            <div class="info-box good"><div class="label">📊 Hasil Self-Eval</div>
                <p><strong>Langkah kamu:</strong> ${um} ${vm?'(valid)':'(tidak valid)'}</p>
                <p><strong>Langkah aktual:</strong> ${am?am.san:'?'}</p>
                <p><strong>Evaluasi aktual:</strong> ${aev}</p>
                ${ue?`<p><strong>Evaluasi kamu:</strong> ${uev}</p>`:''}
                <p style="margin-top:6px">${comp}</p>
            </div>
            ${ur?`<div class="info-box info"><div class="label">🧠 Reasoning Kamu</div><p>"${ur}"</p><p style="margin-top:6px;font-size:0.85em;color:var(--text2)">${reasonFb}</p></div>`:''}
            <div class="lesson-box"><h4>📖 Pelajaran</h4><p>${expl.lesson||'Pelajari posisi ini lebih dalam untuk memahami rencana tepat.'}</p></div>
        `;
    },

    // ================================================================
    //  UI HELPERS
    // ================================================================
    switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(el=>el.classList.remove('active'));
        document.getElementById('tab-'+tab).classList.add('active');
        document.querySelector(`nav button[data-tab="${tab}"]`).classList.add('active');
        if(tab==='profile') this.renderProfile();
        if(tab==='training') this.renderTraining();
        if(tab==='mistakes') this.renderMistakes();
    },

    switchPanel(panel,btn) {
        document.querySelectorAll('.panel-tabs button').forEach(b=>b.classList.remove('active'));
        document.getElementById('p-analysis').style.display='none';
        document.getElementById('p-critical').style.display='none';
        document.getElementById('p-decision').style.display='none';
        document.getElementById('p-'+panel).style.display='block';
        btn.classList.add('active');
    },

    closeModal(id) { document.getElementById(id).classList.remove('active'); },

    resetAll() {
        if(!confirm('Reset semua data? Profil, mistake database, dan game saat ini akan dihapus.')) return;
        localStorage.removeItem('cc_profile');
        localStorage.removeItem('cc_mistakes');
        this.profile=null;this.mistakes=[];this.game=null;this.positions=[];this.moves=[];
        this.evals={};this.classifications={};this.criticals=[];this.curIdx=0;
        this.loadProfile();
        document.getElementById('gi-bar').style.display='none';
        document.getElementById('ml-container').style.display='none';
        document.getElementById('empty-state').style.display='flex';
        document.getElementById('analysis-detail').style.display='none';
        document.getElementById('p-critical').innerHTML='';
        document.getElementById('p-decision').innerHTML='';
        this.renderBoard('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1');
        this.renderProfile();this.renderTraining();this.renderMistakes();
    },

    handleKey(e) {
        if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
        switch(e.key){
            case'ArrowLeft':this.nav('prev');e.preventDefault();break;
            case'ArrowRight':this.nav('next');e.preventDefault();break;
            case'Home':this.nav('first');e.preventDefault();break;
            case'End':this.nav('last');e.preventDefault();break;
            case'f':case'F':this.flip();break;
        }
    }
};

document.addEventListener('DOMContentLoaded',()=>CC.init());
document.addEventListener('keydown',e=>CC.handleKey(e));
document.querySelectorAll('.modal-overlay').forEach(o=>{
    o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('active');});
});
</script>
</body>
</html>
